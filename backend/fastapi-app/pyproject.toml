[project]
name = "spring-boot-demo-fastapi"
version = "1.0.0"
description = "spring-boot-demo 的 FastAPI 复刻版（JWT + RBAC + 双持久层等价实现）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "pydantic>=2.7",
    "email-validator>=2.0",
]

[dependency-groups]
dev = ["httpx>=0.27"]
