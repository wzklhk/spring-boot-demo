# ============================================================
# 开发环境配置
# 特点: H2 内存库开箱即用 + SQL 日志全开 + H2 控制台
# 激活: 默认（未指定 profile 时自动使用），或 SPRING_PROFILES_ACTIVE=dev
# 端口: 9090（与 prod 8080 / 容器映射 8081 区分，避免本地冲突）
# 前端: vite outDir 为默认 dist/（vue/dist），Spring 通过 file: 路径直接托管，
#       起后端即可访问页面；热更新开发仍用 Vite dev server (5173, 代理 /api → 9090)
# ============================================================
server:
  port: 9090

spring:
  output:
    ansi:
      # dev 模式强制启用 ANSI 彩色日志。
      # 默认 detect 依赖 System.console() != null 判定终端，而经 mvnw spring-boot:run / IDE 启动时
      # stdout 经过管道/重定向，常被判为“非终端”，颜色被自动关闭 → 这里强制 always。
      # 仅配置在 dev profile：prod（Docker）日志保持纯文本，避免日志文件混入 ANSI 转义码。
      enabled: always

  web:
    resources:
      # 相对路径基于后端运行目录（cd spring-boot 后执行 mvnw/spring-boot:run 或 java -jar）
      static-locations: file:../vue/dist/,classpath:/static/

  datasource:
    # MODE=MySQL: H2 以 MySQL 兼容模式运行，schema.sql（MySQL 方言）一份脚本通吃 dev/prod
    url: jdbc:h2:mem:demodb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    # 建表/种子数据由 schema.sql + data.sql 完成（主配置 ddl-auto: none），此处仅保留 SQL 日志
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.demo: DEBUG
    org.hibernate.SQL: DEBUG
    com.example.demo.mapper: DEBUG
