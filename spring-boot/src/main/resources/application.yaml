# ============================================================
# 公共配置（所有环境共享）
# 环境专属配置: application-dev.yml（开发）/ application-prod.yml（生产）
#
# Profile 激活方式（优先级从高到低）:
#   1. 环境变量:  SPRING_PROFILES_ACTIVE=prod
#   2. 启动参数:  java -jar app.jar --spring.profiles.active=prod
#   3. 默认值:    spring.profiles.default（未指定时用 dev）
# ============================================================
server:
  port: 8080          # 默认端口；dev profile 显式 9090，prod profile 显式 8080（见各 profile yaml）

spring:
  application:
    name: spring-boot-demo
  profiles:
    default: dev          # 未显式激活 profile 时，默认走开发环境（H2）
  # 建表策略：不使用 JPA 自动建表（ddl-auto: none）
  # 由 spring.sql.init 在应用启动时执行 classpath:schema-{platform}.sql 建表脚本（幂等，IF NOT EXISTS）
  #   - H2（dev/测试）:    schema-h2.sql
  #   - MySQL（prod）:     schema-mysql.sql
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

# MyBatis 配置（与 JPA 共存，共享同一数据源）
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT 鉴权配置
jwt:
  # 签名密钥（HS256 要求 >= 32 字节），生产环境务必通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:spring-boot-demo-jwt-secret-key-change-me-in-production-2026}
  # token 有效期（秒），默认 24 小时
  expiration: 86400

# API 文档（Knife4j + springdoc-openapi）公共配置；prod 在 application-prod.yml 中整体禁用
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

knife4j:
  enable: true
  setting:
    language: zh_cn
