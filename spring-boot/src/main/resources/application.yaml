# ============================================================
# 公共配置（所有环境共享）
# 环境专属配置: application-dev.yaml（开发）/ application-prod.yaml（生产）
#
# Profile 激活方式（优先级从高到低）:
#   1. 环境变量:  SPRING_PROFILES_ACTIVE=prod
#   2. 启动参数:  java -jar app.jar --spring.profiles.active=prod
#   3. 默认值:    spring.profiles.default（未指定时用 dev）
# ============================================================
server:
  port: 8080          # 默认端口；dev profile 显式 9090，prod profile 显式 8080（见各 profile yaml）

spring:
  application:
    name: spring-boot-demo
  profiles:
    default: dev          # 未显式激活 profile 时，默认走开发环境（H2）
  # 建表策略：不使用 JPA 自动建表（ddl-auto: none）
  # 由 spring.sql.init 在启动时执行建表与种子数据脚本（幂等）：
  #   schema.sql 建表（H2 经 MODE=MySQL 兼容模式执行同一份 MySQL 方言脚本）
  #   data.sql   默认管理员种子（admin / 123456）
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

# MyBatis 配置（与 JPA 共存，共享同一数据源）
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT 鉴权配置
jwt:
  # 签名密钥（HS256 要求 >= 32 字节），生产环境务必通过 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:spring-boot-demo-jwt-secret-key-change-me-in-production-2026}
  # token 有效期（秒），默认 24 小时
  expiration: 86400

# API 文档（Knife4j + springdoc-openapi）公共配置；prod 在 application-prod.yaml 中整体禁用
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

knife4j:
  enable: true
  setting:
    language: zh_cn

# ============================================================
# 多级缓存（L1 Caffeine + L2 Redis）
# 可按实体调整开关 / maximum-size / ttl / l2-ttl，无需重新编译
# ============================================================
cache:
  enabled: true

  l1:
    enabled: true

  l2:
    enabled: true

  # Redis Pub/Sub channel：多 JVM 实例间广播 L1 失效
  channel: sb:cache:invalidation

  entities:
    # User 缓存“脱敏资料 DTO”（不含 password）；认证/鉴权直读 DB，改资料/改密/删除后事件失效
    user:
      enabled: true
      maximum-size: 5000
      ttl: 1m
      l2-ttl: 5m

    # 角色/权限：读多写少（内容字典），写后由事件驱动失效
    role:
      enabled: true
      maximum-size: 500
      ttl: 5m
      l2-ttl: 30m

    permission:
      enabled: true
      maximum-size: 500
      ttl: 5m
      l2-ttl: 30m

    # 派生读模型：由 user_role / role_permission 关系写入驱动失效
    user-roles:
      enabled: true
      maximum-size: 5000
      ttl: 1m
      l2-ttl: 5m

    role-permissions:
      enabled: true
      maximum-size: 1000
      ttl: 1m
      l2-ttl: 5m

    user-permissions:
      enabled: true
      maximum-size: 5000
      ttl: 1m
      l2-ttl: 5m
